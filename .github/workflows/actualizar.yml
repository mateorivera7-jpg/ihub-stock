name: Actualizar stock

on:
  schedule:
    - cron: "*/20 11-23,0-3 * * *"   # cada 20 min, de 6:00 a 22:00 hora de Ecuador
  workflow_dispatch: {}               # botón "Run workflow" para actualizar al instante
  push:
    paths: ["actualizar.py"]

permissions:
  contents: write

concurrency: actualizar

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python actualizar.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Guardar cambios
        run: |
          git config user.name "iHub bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/catalogo.json
          git diff --cached --quiet || (git commit -m "Stock actualizado" && git push)
