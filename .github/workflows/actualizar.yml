name: Actualizar stock

on:
  schedule:
    - cron: "*/20 11-23,0-3 * * *"   # cada 20 min, de 6:00 a 22:00 hora de Ecuador
  workflow_dispatch: {}               # botón "Run workflow" para actualizar al instante
  push:
    paths: ["actualizar.py"]

permissions:
  contents: write

concurrency: actualizar

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      MARGENES_JSON: ${{ secrets.MARGENES_JSON }}
    steps:
      - name: Revisar configuración
        if: env.SUPABASE_SECRET_KEY == '' && env.MARGENES_JSON == ''
        run: echo "::notice::Falta el secreto MARGENES_JSON (o la llave de Supabase) en Settings → Secrets → Actions. No se actualiza nada todavía."
      - uses: actions/checkout@v4
        if: env.SUPABASE_SECRET_KEY != '' || env.MARGENES_JSON != ''
      - uses: actions/setup-python@v5
        if: env.SUPABASE_SECRET_KEY != '' || env.MARGENES_JSON != ''
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        if: env.SUPABASE_SECRET_KEY != '' || env.MARGENES_JSON != ''
      - run: python -m playwright install --with-deps chromium
        if: env.SUPABASE_SECRET_KEY != '' || env.MARGENES_JSON != ''
      - run: python actualizar.py
        if: env.SUPABASE_SECRET_KEY != '' || env.MARGENES_JSON != ''
      - name: Guardar cambios
        if: env.SUPABASE_SECRET_KEY != '' || env.MARGENES_JSON != ''
        run: |
          git config user.name "iHub bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/catalogo.json
          git diff --cached --quiet || (git commit -m "Stock actualizado" && git push)
